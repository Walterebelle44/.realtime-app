services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    volumes: [pg:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres/app
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on: [postgres]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes: {pg: {}}
