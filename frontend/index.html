<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier</title>
<style>
:root{--ink:#1d2433;--paper:#f3f1ec;--line:#d9d5cb;--accent:#1f5eff;--mute:#6b7280}
@media(prefers-color-scheme:dark){:root{--ink:#e8e6e0;--paper:#161a23;--line:#2c3342;--mute:#9aa3b2}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Avenir Next",Avenir,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input{font:inherit;color:inherit}input{background:transparent;border:1px solid var(--line);padding:8px 10px;border-radius:6px}
button{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px 1fr;height:100vh}@media(max-width:700px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
aside{border-right:1px solid var(--line);padding:16px;overflow:auto}main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px}.msg{margin:0 0 10px}.msg b{margin-right:8px}.msg small,.mute{color:var(--mute)}
.compose{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.compose input{flex:1}
.room{display:block;width:100%;text-align:left;margin:2px 0}.card{max-width:340px;margin:12vh auto;padding:24px;display:grid;gap:10px}
.boardwrap{position:relative;flex:1;background:#fff;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}
.cur{position:absolute;pointer-events:none;font-size:12px;padding:1px 6px;border-radius:4px;color:#fff;transform:translate(8px,8px)}
.status{font-size:12px;color:var(--mute)}
</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
